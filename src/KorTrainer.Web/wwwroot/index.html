<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>KorTrainer — тренажёр корейского</title>
    <base href="/" />
    <script>
        // Apply the saved theme before Blazor starts to avoid a flash of the wrong colors.
        try {
            const theme = localStorage.getItem('kortrainer-theme');
            if (theme === 'Light' || theme === 'Dark') {
                document.documentElement.dataset.theme = theme.toLowerCase();
            }
        } catch { /* storage unavailable */ }
    </script>
    <meta name="theme-color" content="#c0392f" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="_content/KorTrainer.UI/css/app.css" />
</head>

<body>
    <div id="app">
        <div class="boot">
            <span class="brand-mark" lang="ko">한</span>
            <p>Загрузка тренажёра…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Произошла ошибка.
        <a href="." class="reload">Перезагрузить</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <div id="update-ui" class="update-ui" role="status" hidden>
        Доступна новая версия тренажёра.
        <a href="." class="reload">Обновить</a>
    </div>
    <script>
        // Service workers need a secure context (https or localhost); elsewhere the app simply runs online.
        if ('serviceWorker' in navigator) {
            const hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (hadController) {
                    document.getElementById('update-ui').hidden = false;
                }
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .catch(error => console.warn('Service worker registration failed', error));
        }
    </script>
</body>

</html>
