<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>KorTrainer — тренажёр корейского</title>
    <base href="/" />
    <script>
        // Apply the saved theme before Blazor starts to avoid a flash of the wrong colors.
        try {
            const theme = localStorage.getItem('kortrainer-theme');
            if (theme === 'Light' || theme === 'Dark') {
                document.documentElement.dataset.theme = theme.toLowerCase();
            }
        } catch { /* storage unavailable */ }
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <span class="brand-mark" lang="ko">한</span>
            <p>Загрузка тренажёра…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Произошла ошибка.
        <a href="." class="reload">Перезагрузить</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
